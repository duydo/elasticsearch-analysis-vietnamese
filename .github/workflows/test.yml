name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entry:
          - { version: 21, distribution: 'temurin' }
          - { version: 25, distribution: 'temurin' }
    steps:
      - name: Checkout analysis-vietnamese 
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Checkout coccoc-tokenizer
        uses: actions/checkout@v5
        with:
          repository: duydo/coccoc-tokenizer
          path: coccoc-tokenizer
          fetch-depth: 1
      - name: Build coccoc-tokenizer
        working-directory: ./coccoc-tokenizer
        run: |
          mkdir build && cd build
          cmake -DBUILD_JAVA=1 ..
          sudo make install
      - name: Set up JDK ${{ matrix.entry.version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.entry.version }}
          distribution: ${{ matrix.entry.distribution }}
          cache: maven
          cache-dependency-path: pom.xml
      - name: Build and Test
        run: mvn --batch-mode verify

  # The plugin is a stable plugin: the same build must work on the oldest supported
  # Elasticsearch release and on newer ones.
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        es-version: ['9.5.0', '9.5.5']
    steps:
      - name: Checkout analysis-vietnamese
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Build Elasticsearch image with the plugin
        run: docker build --build-arg ES_VERSION=${{ matrix.es-version }} -t es-vi .
      - name: Start Elasticsearch
        run: |
          docker run -d --name es -p 9200:9200 -e discovery.type=single-node \
            -e xpack.security.enabled=false -e ES_JAVA_OPTS="-Xms1g -Xmx1g" es-vi
          for i in $(seq 1 60); do curl -sf localhost:9200/_cluster/health && break; sleep 5; done
          docker exec es bash -c 'mkdir -p config/analysis && printf "thông tin\nviệt nam\n" > config/analysis/vi_stop.txt'
      - name: Run smoke test
        run: python3 scripts/smoke_test.py http://localhost:9200
      - name: Elasticsearch logs
        if: failure()
        run: docker logs es | tail -200
